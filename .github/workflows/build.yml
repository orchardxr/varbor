name: Build MacVR.app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_MINGW_VERSION: "20260922"
  LLVM_MINGW_SHA256: 52e5f5a7b131021d0c39a37a38fa380a1da7885cd04bd61afd0cd4ecfb8bc1f3
  VULKAN_SDK_VERSION: 1.4.304.0
  VULKAN_SDK_SHA256: d8909362c8cd6a61a33f8ab21240c6d3f38c3818f443f52939a9ac198ad0e539
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  # Every CMake build (native and llvm-mingw) compiles through ccache. It keys on contents, so the fresh mtimes of
  # a checkout and patches.sh apply still hit.
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CMAKE_OBJC_COMPILER_LAUNCHER: ccache
  CMAKE_OBJCXX_COMPILER_LAUNCHER: ccache
  CCACHE_DIR: /Users/runner/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros,pch_defines
  CCACHE_MAXSIZE: 2G

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select the newest Xcode
        run: |
          xcode="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
          echo "macOS SDK $(xcrun --show-sdk-version)"
          swift --version

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Brewfile') }}
          restore-keys: brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Homebrew dependencies
        run: |
          brew bundle --file=Brewfile --no-upgrade
          brew install ccache

      # Installs the universal loader, headers and glslc into /usr/local (the x86_64 IPC client links the x86_64
      # slice). The installer's component names are LunarG's; not exercised outside CI.
      - name: Cache Vulkan SDK download
        uses: actions/cache@v4
        with:
          path: ~/vulkansdk-dl
          key: vulkansdk-${{ env.VULKAN_SDK_VERSION }}
      - name: Vulkan SDK
        run: |
          mkdir -p ~/vulkansdk-dl && cd ~/vulkansdk-dl
          zip="vulkansdk-macos-$VULKAN_SDK_VERSION.zip"
          [[ -f "$zip" ]] || curl -fsSLo "$zip" "https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/mac/$zip"
          echo "$VULKAN_SDK_SHA256  $zip" | shasum -a 256 -c -
          rm -rf InstallVulkan.app && unzip -q "$zip"
          sudo ./InstallVulkan.app/Contents/MacOS/InstallVulkan --root "$HOME/VulkanSDK/$VULKAN_SDK_VERSION" \
            --accept-licenses --default-answer --confirm-command install com.lunarg.vulkan.core com.lunarg.vulkan.usr
          lipo -archs /usr/local/lib/libvulkan.dylib
          ls /usr/local/include/vulkan/vulkan_core.h /usr/local/bin/glslc

      - name: Cache llvm-mingw
        id: llvm-mingw-cache
        uses: actions/cache@v4
        with:
          path: ~/toolchains/llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-ucrt-macos-universal
          key: llvm-mingw-${{ env.LLVM_MINGW_VERSION }}-${{ env.LLVM_MINGW_SHA256 }}
      - name: llvm-mingw
        run: |
          dir="$HOME/toolchains/llvm-mingw-$LLVM_MINGW_VERSION-ucrt-macos-universal"
          if [[ ! -x "$dir/bin/x86_64-w64-mingw32-clang" ]]; then
            mkdir -p ~/toolchains && cd ~/toolchains
            tarball="llvm-mingw-$LLVM_MINGW_VERSION-ucrt-macos-universal.tar.xz"
            curl -fsSLo "$tarball" "https://github.com/mstorsjo/llvm-mingw/releases/download/$LLVM_MINGW_VERSION/$tarball"
            echo "$LLVM_MINGW_SHA256  $tarball" | shasum -a 256 -c -
            tar -xJf "$tarball" && rm "$tarball"
          fi
          echo "LLVM_MINGW=$dir" >> "$GITHUB_ENV"

      - name: Apply patches
        run: |
          scripts/patches.sh apply
          scripts/patches.sh status

      # A new entry every run, restored from the newest one.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: /Users/runner/.ccache
          key: ccache-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.arch }}-
      - name: ccache stats reset
        run: ccache --zero-stats

      # Only the loader and the generated headers: the app's web helper and the server's test programs use them.
      - name: OpenXR SDK (native loader for the server's test programs)
        run: NINJA_TARGET=openxr_loader scripts/build.sh openxr-sdk

      - name: OpenXR SDK for Windows (loader, generated headers, Vulkan import library)
        run: scripts/build-bridge.sh openxr-sdk-win

      - name: OpenComposite
        run: scripts/build-opencomposite.sh

      - name: WiVRn server
        run: WIVRN_BUILD_DIR="$PWD/build/wivrn-next" scripts/build-wivrn.sh --snapshot

      # x86_64 slice: Monado's client only needs the universal Vulkan SDK in /usr/local and Eigen's headers, so no
      # x86_64 Homebrew is needed.
      - name: WiVRn IPC client (x86_64, Rosetta runners)
        run: scripts/build-wivrn.sh --client-x86_64

      - name: WiVRn IPC client (arm64, FEX runners)
        run: scripts/build-wivrn.sh --client-arm64

      - name: Bridge
        run: scripts/build-bridge.sh bridge

      - name: MacVR.app
        run: WIVRN_BUILD_DIR="$PWD/build/wivrn-next" scripts/build-app.sh --test

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/logs

      - name: Zip MacVR.app
        run: ditto -c -k --keepParent build/app/MacVR.app build/MacVR.app.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MacVR.app
          path: build/MacVR.app.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/app/MacVR.app/Contents/Info.plist)"
          [[ "v$version" == "$TAG" ]] || { echo "tag $TAG does not match app version $version" >&2; exit 1; }
          zip="build/MacVR-$version.zip"
          cp build/MacVR.app.zip "$zip"
          notes="docs/releases/$TAG.md"
          if [[ -f "$notes" ]]; then args=(--notes-file "$notes"); else args=(--generate-notes); fi
          gh release create "$TAG" "$zip" --verify-tag --title "MacVR $version" "${args[@]}"
